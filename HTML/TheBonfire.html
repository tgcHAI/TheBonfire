<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120d06">
<title>Bonfire.bat — Eternal Hearthlight Office</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/TheBonfire.css">
  <script src="../js/gate.js"></script>
  <script src="../js/wm.js"></script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-logo"></div>
    <span class="topbar-title">Bonfire.exe</span>
    <nav class="topbar-nav" aria-label="Sections">
      <!-- Files and the Conversation Pit are desktop icons now, not page links:
           this shell owns the window layer, so navigating away would be a step
           backwards. The remaining slots are apps that do not exist yet. -->
      <span class="topbar-nav-item is-soon" role="link" aria-disabled="true" title="Personnel — coming soon" aria-label="Personnel — coming soon">
        <span class="nav-ico nav-ico-personnel" aria-hidden="true"></span>
      </span>
      <span class="topbar-nav-item is-soon" role="link" aria-disabled="true" title="Lost and Found — coming soon" aria-label="Lost and Found — coming soon">
        <span class="nav-ico nav-ico-lnf" aria-hidden="true"></span>
      </span>
    </nav>
    <span class="topbar-sub">Eternal Hearthlight Office — Lore Archive</span>
    <!-- Entry editing now lives behind Admin.exe -> Entry.exe. The pencil stays in
         the bar as an inert placeholder for that route, but disabled so it cannot
         be pressed into a second way in. -->
    <button class="editor-toggle" type="button" disabled aria-disabled="true" title="Entry editor — open Admin.exe" aria-label="Entry editor — open Admin.exe">&#9998;</button>
  </header>

  <!-- ADMIN HUB (adopted into the window layer at boot, so it is written here and
       WM.adopt() relocates it). It edits nothing itself: it asks which editor you
       want and opens Entry.exe or Conv.exe as a window of its own. -->
  <section class="pwin" id="win-admin" role="dialog" aria-label="Admin.exe">
    <div class="pwin-bar" data-wm-drag>
      <span class="pwin-ico pwin-ico-admin" aria-hidden="true"></span>
      <span class="pwin-title">Admin.exe</span>
      <span class="pwin-btns">
        <button type="button" class="pwin-btn" data-wm-act="min" title="Minimize" aria-label="Minimize the window">_</button>
        <button type="button" class="pwin-btn" data-wm-act="max" title="Maximize" aria-label="Maximize the window">&#9633;</button>
        <button type="button" class="pwin-btn" data-wm-act="close" title="Close" aria-label="Close the window">&#215;</button>
      </span>
    </div>
    <div class="pwin-body admin-hub">
      <p class="admin-hub-lead">Which editor?</p>
      <button type="button" class="hub-card" onclick="openEntryEditor()">
        <span class="hub-card-ico hub-card-ico-entry" aria-hidden="true"></span>
        <span class="hub-card-text">
          <b>Entry.exe</b>
          <span>Lore archive entries &mdash; fields, body, restriction</span>
        </span>
      </button>
      <button type="button" class="hub-card" onclick="openConvApp()">
        <span class="hub-card-ico hub-card-ico-conv" aria-hidden="true"></span>
        <span class="hub-card-text">
          <b>Conv.exe</b>
          <span>Conversation rooms &mdash; messages, timing, ordering</span>
        </span>
      </button>
    </div>
  </section>

  <!-- ENTRY.EXE: the entry editor form, adopted into the window layer at boot. -->
  <section class="pwin" id="win-entry" role="dialog" aria-label="Entry.exe">
    <div class="pwin-bar" data-wm-drag>
      <span class="pwin-ico pwin-ico-entry" aria-hidden="true"></span>
      <span class="pwin-title">Entry.exe</span>
      <span class="pwin-btns">
        <button type="button" class="pwin-btn" data-wm-act="min" title="Minimize" aria-label="Minimize the window">_</button>
        <button type="button" class="pwin-btn" data-wm-act="max" title="Maximize" aria-label="Maximize the window">&#9633;</button>
        <button type="button" class="pwin-btn" data-wm-act="close" title="Close" aria-label="Close the window">&#215;</button>
      </span>
    </div>
    <div class="pwin-body admin-body">
    <div class="editor-inner">
      <div class="editor-heading">
        <span>Entry Editor</span>
        <div class="editor-actions">
          <button class="ed-btn ed-new" onclick="newEntry()">New</button>
          <button class="ed-btn ed-save" onclick="saveEntry()">Save</button>
          <button class="ed-btn ed-delete" onclick="deleteEntry()">Delete</button>
          <button class="ed-btn ed-export" onclick="exportJSON()">Export JSON</button>
        </div>
      </div>
      <div class="editor-fields">
        <div class="ed-row">
          <div class="ed-field">
            <label for="ed-id">ID</label>
            <input type="text" id="ed-id" placeholder="EHO-005">
          </div>
          <div class="ed-field">
            <label for="ed-title">Title</label>
            <input type="text" id="ed-title" placeholder="Entry title">
          </div>
          <div class="ed-field">
            <label for="ed-author">Author</label>
            <input type="text" id="ed-author" placeholder="Author name">
          </div>
          <div class="ed-field">
            <label for="ed-date">Date</label>
            <input type="text" id="ed-date" placeholder="21XX">
          </div>
        </div>
        <div class="ed-row">
          <div class="ed-field">
            <label for="ed-status">Status</label>
            <input type="text" id="ed-status" placeholder="Active / Ongoing / Sealed...">
          </div>
          <div class="ed-field">
            <label for="ed-category">Category</label>
            <input type="text" id="ed-category" placeholder="Field Observation, Personal Log...">
          </div>
          <div class="ed-field">
            <label for="ed-tags">Tags <span class="ed-hint">(comma separated)</span></label>
            <input type="text" id="ed-tags" placeholder="tag1, tag2, tag3">
          </div>
          <div class="ed-field ed-field-check">
            <label>
              <input type="checkbox" id="ed-restricted">
              Restricted
            </label>
          </div>
        </div>
        <div class="ed-field ed-body-field">
          <label for="ed-body">Body <span class="ed-hint">(blank line = new paragraph)</span></label>
          <textarea id="ed-body" placeholder="Write the entry here..."></textarea>
        </div>
      </div>
    </div>

      </div>
  </section>

  <!-- CONV.EXE: a second, editor-only frame of the Conversation Pit (?app=editor)
       that boots straight into the editor window - no chat, no desktop icons. The
       frame is injected on first open, so this app is not downloaded and booted
       until it is actually asked for. It is a SEPARATE instance from the
       Conversation Pit window: the two do not see each other's edits until a
       reload, though the store underneath is shared, so nothing is lost. -->
  <section class="pwin" id="win-conv" role="dialog" aria-label="Conv.exe">
    <div class="pwin-bar" data-wm-drag>
      <span class="pwin-ico pwin-ico-conv" aria-hidden="true"></span>
      <span class="pwin-title">Conv.exe</span>
      <span class="pwin-btns">
        <button type="button" class="pwin-btn" data-wm-act="min" title="Minimize" aria-label="Minimize the window">_</button>
        <button type="button" class="pwin-btn" data-wm-act="max" title="Maximize" aria-label="Maximize the window">&#9633;</button>
        <button type="button" class="pwin-btn" data-wm-act="close" title="Close" aria-label="Close the window">&#215;</button>
      </span>
    </div>
    <div class="pwin-body conv-body"></div>
  </section>

  <div class="body">

    <!-- DESKTOP SURFACE (wallpaper + app icons; the window layer sits above) -->
    <main class="main" id="main" aria-label="Desktop surface">
      <div class="desk-icons" id="deskIcons" aria-label="Desktop icons">
        <button type="button" class="desk-ico" data-wm-open="files" title="Open the lore archive">
          <span class="desk-ico-img desk-ico-files" aria-hidden="true"></span>
          <span class="desk-ico-label">Files</span>
        </button>
        <button type="button" class="desk-ico" data-wm-open="chat" title="Open the Conversation Pit">
          <span class="desk-ico-img desk-ico-chat" aria-hidden="true"></span>
          <span class="desk-ico-label">Conversation Pit</span>
        </button>
      </div>

      <!-- Bottom-right corner of the surface: the administration tools, kept
           apart from the two reading apps that sit top-left. -->
      <div class="desk-corner" id="deskCorner">
        <button type="button" class="desk-ico" data-wm-open="admin" title="Open Admin.exe">
          <span class="desk-ico-img desk-ico-admin" aria-hidden="true"></span>
          <span class="desk-ico-label">Admin.exe</span>
        </button>
      </div>
    </main>

  </div>

  <!-- DESKTOP WINDOW LAYER (pseudo-window host). Pointer-transparent so the
       desktop icons underneath stay clickable; windows opt back in. -->
  <div class="desktop" id="desktop">

    <!-- FILES WINDOW: adopted rather than rebuilt, so the decode engine keeps
         its live references to #entryBox and the scroll/auto-follow state. -->
    <section class="pwin" id="win-files" role="dialog" aria-label="Files">
      <div class="pwin-bar" data-wm-drag>
        <span class="pwin-ico pwin-ico-files" aria-hidden="true"></span>
        <span class="pwin-title">Files</span>
        <span class="pwin-btns">
          <button type="button" class="pwin-btn" data-wm-act="min" title="Minimize" aria-label="Minimize the window">_</button>
          <button type="button" class="pwin-btn" data-wm-act="max" title="Maximize" aria-label="Maximize the window">&#9633;</button>
          <button type="button" class="pwin-btn" data-wm-act="close" title="Close" aria-label="Close the window">&#215;</button>
        </span>
      </div>

      <div class="pwin-body files-body">
        <nav class="sidebar" id="sidebar" aria-label="Entries">
          <div class="sidebar-label">Entries</div>
          <!-- populated by JS -->
        </nav>

        <div class="files-main">
          <div class="entry-header" id="entryHeader">
            <!-- populated by JS -->
          </div>
          <div class="entry-box-wrap">
            <div class="entry-box" id="entryBox">
              <!-- populated by JS -->
            </div>
            <button type="button" class="entry-skip-btn" id="skipBtn" onclick="skipEntryDecode()" aria-label="Skip: unscramble this entry now">Skip &#10095;</button>
          </div>
        </div>

        <!-- MOBILE: collapse/expand the entry list. Lives inside this window so
             it cannot escape onto the desktop surface. -->
        <button id="sidebarToggle" class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Hide the entry list" aria-expanded="true" aria-controls="sidebar">&#10094;</button>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      </div>
    </section>

    <div class="wm-alert" id="wmAlert" role="alert" hidden></div>

    <!-- TRANSIENT STATUS (last window action) -->
    <span class="wm-status" id="wmStatus" role="status" aria-live="polite"></span>

    <!-- TASKBAR: a chip per open window -->
    <div class="wm-taskbar" id="wmTaskbar" role="toolbar" aria-label="Open windows"></div>
  </div>
</div>

<script>
  // Entries load from ../json/entries.json over HTTP; there is no embedded
  // copy, so the JSON file is the single source of truth.
  let entries = [];
  let currentIndex = 0;
  let editingIndex = -1;

  // ── READER CONTROLS: skip-decode + idle auto-scroll ──
  let activeDecode = null;          // live scramble: { token, nodes, finish }
  let lastScrollActivity = 0;       // performance.now() of the reader's own scroll input
  const IDLE_AUTOSCROLL_MS = 10000; // auto-scroll resumes after this much stillness
  const IDLE_FOLLOW_GAP = 240;      // px the decode must outrun the view before a nudge
  const SCROLL_KEYS = new Set(['PageUp', 'PageDown', 'Home', 'End', 'ArrowUp', 'ArrowDown', ' ']);

  // ── LOAD ──
  async function loadEntries() {
    try {
      const res = await fetch('../json/entries.json?nocache=' + Date.now());
      if (res.ok) entries = await res.json();
    } catch(e) {
      // fetch unavailable (e.g. file://) — no embedded copy, so the archive
      // starts empty until it is served and the JSON can be fetched
    }
    renderSidebar();
    // Restricted entries are hidden while the archive is locked, so land on
    // the first one that is actually accessible.
    const firstVisible = entries.findIndex(e => !e.restricted || Gate.isUnlocked());
    renderEntry(firstVisible < 0 ? 0 : firstVisible);
  }

  // ── SIDEBAR ──
  function renderSidebar() {
    const nav = document.getElementById('sidebar');
    nav.innerHTML = '<div class="sidebar-label">Entries</div>';
    entries.forEach((e, i) => {
      if (e.restricted && !Gate.isUnlocked()) return; // gated — hidden while locked
      const a = document.createElement('a');
      const active = i === currentIndex;
      a.className = 'nav-item' + (active ? ' active' : '');
      if (active) a.setAttribute('aria-current', 'true');
      a.href = '#';
      // Titles are wrapped rather than interpolated as loose text so they can
      // ellipsize on their own; room titles run to 50 characters.
      const name = document.createElement('span');
      name.className = 'nav-title';
      name.textContent = e.title;
      a.innerHTML = '';
      const id = document.createElement('span');
      id.className = 'entry-id';
      id.textContent = e.id;
      a.appendChild(id);
      if (e.restricted) {
        const tag = document.createElement('span');
        tag.className = 'restricted-badge';
        tag.textContent = '🔒';
        a.appendChild(tag);
      }
      a.appendChild(name);
      a.onclick = (ev) => { ev.preventDefault(); switchEntry(i); };
      nav.appendChild(a);
    });
  }

  // ── RENDER ENTRY ──
  function renderEntry(index) {
    if (!entries.length) return;
    currentIndex = index;
    const e = entries[index];
    if (!e || (e.restricted && !Gate.isUnlocked())) return; // not accessible while gated

    // header
    document.getElementById('entryHeader').innerHTML = `
      <div class="entry-id-tag">${e.id} &mdash; ${e.category}</div>
      <h1 class="entry-title">${e.title}${e.restricted ? ' <span class="restricted-badge">&#128274;</span>' : ''}</h1>
      <div class="entry-meta">
        <span>${e.author}</span>
        <span>${e.date}</span>
        <span>${e.status}</span>
        <span class="entry-tags">${(e.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</span>
      </div>
    `;

    // inline markdown parser
    function parseInline(text) {
      return text
        // bold — **word**
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // italic — *word* (no lookbehind, so it parses on every browser;
        // bold is replaced first, so any remaining * is a single italic marker)
        .replace(/\*([^*\s][^*]*?)\*/g, '<em>$1</em>')
        // underline — _word_
        .replace(/\_(.+?)\_/g, '<u>$1</u>');
    }

    // Split on 3 newlines first (spacer) then 2 (paragraph).
    // We tag each chunk so we know which gap preceded it.
    const box = document.getElementById('entryBox');
    const chunks = [];
    // Split on \n\n\n (spacer gap) — keep the delimiter type
    const spacerParts = e.body.split(/\n{3}/);
    spacerParts.forEach((part, si) => {
      // Within each spacer-section, split on \n\n (normal paragraph gap)
      const paraParts = part.split(/\n\n/);
      paraParts.forEach((block, pi) => {
        if (si > 0 && pi === 0) {
          // this block follows a spacer gap — insert spacer before it
          chunks.push({ type: 'spacer' });
        }
        chunks.push({ type: 'block', text: block });
      });
    });

    let firstParagraph = true;
    const finalHtml = chunks.map(chunk => {
      if (chunk.type === 'spacer') return '<div class="spacer"></div>';
      if (!chunk.text.trim()) return ''; // skip empty
      const lines = chunk.text.split('\n').map(parseInline).join('<br>');
      if (firstParagraph) {
        firstParagraph = false;
        const first = lines.charAt(0);
        const rest = lines.slice(1);
        return `<p><span class="drop">${first}</span>${rest}</p>`;
      }
      return `<p>${lines}</p>`;
    }).join('');
    box.innerHTML = finalHtml;
    // Large top padding keeps the first line below the box top at
    // scrollTop = 0 (wheel-picker feel) — no extra calculation needed.
    box.scrollTop = 0;
    // A fresh render restarts the idle window, so auto-scroll only follows the
    // decode once the reader has held still for a full IDLE_AUTOSCROLL_MS.
    lastScrollActivity = 0;
    animateEntryText(box);
  }

  // MATRIX-STYLE DECODE: gibberish decrypts left -> right.
  const SCRAMBLE_GLYPHS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ01';
  const SCRAMBLE_DURATION = 90000; // ms for the wave to cross the whole entry
  // Unrevealed glyphs swap once per second per column (cadence defined inside
  // animateEntryText); as the wave passes, characters lock in permanently.
  let entryRenderToken = 3;       // bumped per render; stale rAF loops stop instantly

  function animateEntryText(box) {
    box.setAttribute('aria-busy', 'true');

    // Only leaf text is scrambled; markup structure stays untouched.
    const nodes = [];
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const el = walker.currentNode;
      if (el.nodeValue.trim()) nodes.push({ el: el, final: el.nodeValue });
    }
    if (!nodes.length) { clearDecodeState(box); box.removeAttribute('aria-busy'); return; }

    // Whitespace stays whitespace; decoded chars lock in place.
    const scramble = (final, count) => {
      let out = '';
      for (let j = 0; j < final.length; j++) {
        const c = final[j];
        out += (j < count || c === ' ' || c === '\t') ? c
             : SCRAMBLE_GLYPHS[(Math.random() * SCRAMBLE_GLYPHS.length) | 0];
      }
      return out;
    };

    // One wave over the flattened text; any length decodes in SCRAMBLE_DURATION.
    let cursor = 0;
    for (const t of nodes) { t.offset = cursor; cursor += t.final.length; }
    const totalChars = Math.max(1, cursor);

    // Static masks only seed the very first frame; from then on every unrevealed
    // char swaps glyphs on the 1s cadence below (no reduced-motion freeze).
    const mask = nodes.map(t => scramble(t.final, 0));

    // Seeded now so real text never flashes.
    for (let i = 0; i < nodes.length; i++) nodes[i].el.nodeValue = mask[i];

    const token = ++entryRenderToken;
    const start = performance.now() + 90; // brief all-gibberish beat before resolving
    let complete = false;
    // Register this run as the skippable decode; finish() is the single exit
    // shared by natural completion and the Skip button.
    activeDecode = { token: token, nodes: nodes, box: box, finish: null };
    const finish = () => {
      if (complete) return;
      complete = true;
      clearDecodeState(box);
      box.removeAttribute('aria-busy');
    };
    activeDecode.finish = finish;
    box.parentElement.classList.add('is-decoding');

    const msPerChar = SCRAMBLE_DURATION / totalChars;

    // Unrevealed glyphs swap once per second per column; a per-column phase
    // keeps the field shifting out of sync, so it reads as a live scramble.
    const SWITCH_MS = 100;              // cadence each column changes glyphs
    const SWITCH_STAGGER = 100;             // ms phase offset between columns
    const SWITCH_ORIGIN = start - SWITCH_MS * 10; // mid-sequence on frame one

    const tick = (now) => {
      if (complete || entryRenderToken !== token) { clearInterval(fallbackTimer); return; }
      // Idle auto-scroll: while decoding, chase the reveal front once the
      // reader has held still for IDLE_AUTOSCROLL_MS. Programmatic scrollTo()
      // raises untrusted scroll events, so following never reregisters itself.
      if (now - lastScrollActivity >= IDLE_AUTOSCROLL_MS &&
          box.scrollTop + box.clientHeight < box.scrollHeight - IDLE_FOLLOW_GAP) {
        box.scrollTo({ top: box.scrollHeight }); // CSS scroll-behavior animates it
      }
      // Per-char timeline: the wave locks char p at revealAt; until then the
      // column shows a scramble glyph that advances once per second.
      let pending = 0;
      for (let i = 0; i < nodes.length; i++) {
        const t = nodes[i];
        let out = '';
        for (let j = 0; j < t.final.length; j++) {
          const revealAt = start + (t.offset + j + 1) * msPerChar;
          if (now >= revealAt) { out += t.final[j]; continue; }
          const c = t.final[j];
          if (c === ' ' || c === '\t') { out += c; continue; }
          // Column clock is positive for the whole run (SWITCH_ORIGIN sits 8
          // seconds before start), so the field is mid-sequence on frame one.
          const phaseMs = ((t.offset + j) * SWITCH_STAGGER) % SWITCH_MS;
          const step = Math.floor((now - SWITCH_ORIGIN - phaseMs) / SWITCH_MS);
          out += SCRAMBLE_GLYPHS[((t.offset + j) * 7 + step) % SCRAMBLE_GLYPHS.length];
        }
        if (out !== t.final) pending++;
        t.el.nodeValue = out;
      }
      if (pending > 0) requestAnimationFrame(tick);
      else finish();
    };
    // Watchdog: rAF is suspended in backgrounded tabs.
    const fallbackTimer = setInterval(() => {
      if (complete) { clearInterval(fallbackTimer); return; }
      tick(performance.now());
    }, 300);
    requestAnimationFrame(tick);
  }

  // Skip: unscramble the entry now. Every masked column locks its final glyph
  // in place and the running decode is closed through the normal finish path,
  // so the Skip button never desyncs the render token or the aria-busy state.
  function skipEntryDecode() {
    const d = activeDecode;
    if (!d) return;
    for (const t of d.nodes) t.el.nodeValue = t.final;
    d.finish();
  }

  // Drops the active-decode registration and the Skip affordance without
  // touching rendered text; used by finish(), empty entries, and when the
  // archive is emptied underneath a running decode.
  function clearDecodeState(box) {
    activeDecode = null;
    box.parentElement.classList.remove('is-decoding');
  }

  // Reader input on the entry box pauses the idle auto-scroll. Trusted scroll
  // events (scrollbar drags, wheel, touch) count as activity; the decode's own
  // programmatic scrollTo() raises untrusted events and is ignored here, so
  // auto-following never counts as its own activity.
  function trackEntryScrollActivity() {
    const box = document.getElementById('entryBox');
    if (!box) return;
    const poke = () => { lastScrollActivity = performance.now(); };
    box.addEventListener('wheel', poke, { passive: true });
    box.addEventListener('touchmove', poke, { passive: true });
    box.addEventListener('keydown', ev => { if (SCROLL_KEYS.has(ev.key)) poke(); });
    box.addEventListener('scroll', ev => { if (ev.isTrusted) poke(); });
  }

  function switchEntry(index) {
    currentIndex = index;
    renderSidebar();
    renderEntry(index);
    // On phones the drawer overlays the text — dismiss it once an entry is picked.
    if (isMobile() && !document.body.classList.contains('sidebar-collapsed')) setSidebar(false);
    // keep the editor form aligned with the entry being viewed when the admin
    // window is open (otherwise the form and editingIndex can silently point at
    // another entry)
    if (typeof WM !== 'undefined' && WM.isOpen('entry')) loadEditorFields(index);
  }

  // ── EDITOR LAUNCHERS ──
  // Admin.exe is a hub: it edits nothing and simply asks which editor you want.
  // Each answer is a window of its own, and the topbar pencil is a shortcut
  // straight to Entry.exe - the pencil sits beside the reader, so it means
  // "edit this entry", not "show me a menu".
  function openEntryEditor() {
    const win = WM.open('entry');
    if (win) loadEditorFields(currentIndex);
  }

  function openConvApp() {
    WM.open('conv');
  }

  // MOBILE SIDEBAR DRAWER
  function isMobile() {
    return window.matchMedia('(max-width: 820px)').matches;
  }

  function setSidebar(open) {
    document.body.classList.toggle('sidebar-collapsed', !open);
    const btn = document.getElementById('sidebarToggle');
    btn.innerHTML = open ? '&#10094;' : '&#10095;';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Hide the entry list' : 'Show the entry list');
    // Closing strands focus on a row that is now translated off-screen and
    // visibility:hidden, i.e. no longer reachable by Tab. Hand it to the panel
    // the drawer was covering so keyboard users land back in the entry.
    if (!open) {
      const main = document.querySelector('.files-main');
      if (main) {
        main.setAttribute('tabindex', '-1');
        main.focus({ preventScroll: true });
      }
    }
  }

  function toggleSidebar() {
    setSidebar(document.body.classList.contains('sidebar-collapsed'));
  }

  // tapping the dimmed area under the drawer dismisses it
  document.getElementById('sidebarBackdrop').addEventListener('click', function() {
    setSidebar(false);
  });

  function loadEditorFields(index) {
    editingIndex = index;
    const e = entries[index] || {};
    document.getElementById('ed-id').value       = e.id       || '';
    document.getElementById('ed-title').value    = e.title    || '';
    document.getElementById('ed-author').value   = e.author   || '';
    document.getElementById('ed-date').value     = e.date     || '';
    document.getElementById('ed-status').value   = e.status   || '';
    document.getElementById('ed-category').value = e.category || '';
    document.getElementById('ed-tags').value     = (e.tags||[]).join(', ');
    document.getElementById('ed-restricted').checked = e.restricted || false;
    document.getElementById('ed-body').value     = e.body     || '';
  }

  function fieldsToEntry() {
    // Normalize body: collapse 3+ newlines to 2, ensure paragraph breaks
    // are always \n\n so the renderer splits them correctly regardless of
    // whether the user pressed Enter once or twice.
    const rawBody = document.getElementById('ed-body').value;
    const normalizedBody = rawBody
      .replace(/\r\n/g, '\n')       // Windows line endings → unix
      .replace(/\r/g, '\n')         // old Mac line endings → unix
      .replace(/\n{4,}/g, '\n\n\n'); // 4+ newlines → exactly 3 (spacer max)
    return {
      id:         document.getElementById('ed-id').value.trim(),
      title:      document.getElementById('ed-title').value.trim(),
      author:     document.getElementById('ed-author').value.trim(),
      date:       document.getElementById('ed-date').value.trim(),
      status:     document.getElementById('ed-status').value.trim(),
      restricted: document.getElementById('ed-restricted').checked,
      category:   document.getElementById('ed-category').value.trim(),
      tags:       document.getElementById('ed-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
      body:       normalizedBody
    };
  }

  async function persistEntries() {
    try {
      const res = await fetch('../api/entries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entries)
      });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      return 'written';
    } catch (err) {
      // HTML opened without the server (e.g. double-clicked** — keep the
      // in-memory edit, but nothing is written to disk until it's served
      // via server.js. ("browser only" flash messages below.)
      return 'offline';
    }
  }

  // ── NEW ENTRY ──
  function newEntry() {
    const blank = {
      id: 'EHO-' + String(entries.length + 1).padStart(3,'0'),
      title: 'New Entry',
      author: '',
      date: '21XX',
      status: 'Active',
      restricted: false,
      category: '',
      tags: [],
      body: ''
    };
    entries.push(blank);
    editingIndex = entries.length - 1;
    loadEditorFields(editingIndex);
    renderSidebar();
  }

  // ── SAVE ENTRY ──
  async function saveEntry() {
    if (editingIndex < 0) return;
    entries[editingIndex] = fieldsToEntry();
    renderSidebar();
    renderEntry(editingIndex);
    // persist the whole archive back to json/entries.json via the local server.
    // ("browser only" below = opened without server.js — change lives in memory
    // but won't survive a reload until the server writes it to disk.)


    const wrote = await persistEntries();
    const msg = wrote === 'written' ? 'Saved to file!' : 'Saved (browser only)';
    flashBtn('ed-save', msg);
  }

  // ── DELETE ENTRY ──
  async function deleteEntry() {
    if (editingIndex < 0 || !entries.length) return;
    if (!confirm(`Delete "${entries[editingIndex].title}"?`)) return;
    entries.splice(editingIndex, 1);
    editingIndex = Math.max(0, editingIndex - 1);
    currentIndex = editingIndex;
    renderSidebar();
    if (entries.length) {
      loadEditorFields(editingIndex);
      renderEntry(editingIndex);
    } else {
      document.getElementById('entryHeader').innerHTML = '';
      const emptyBox = document.getElementById('entryBox');
      emptyBox.innerHTML = '';
      clearDecodeState(emptyBox);
      emptyBox.removeAttribute('aria-busy');
    }
    await persistEntries().then(w => flashBtn('ed-delete', w === 'written' ? 'Deleted' : 'Deleted (browser only)'));
  }

  // ── EXPORT JSON ──
  function exportJSON() {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'entries.json';
    a.click();
    URL.revokeObjectURL(a.href);
    flashBtn('ed-export', 'Exported!');
  }

  function flashBtn(cls, text) {
    const btn = document.querySelector('.' + cls);
    const orig = btn.textContent;
    btn.textContent = text;
    btn.style.color = 'var(--ember-bright)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1800);
  }

  // sidebar clicks reload the editor fields when the editor panel is open
  // (see switchEntry) — keeps editingIndex aligned with the shown entry

  // Re-render when the gate opens or locks so restricted entries appear or
  // disappear without a reload. If a re-lock leaves the current entry gated,
  // step back to the first still-visible one.
  window.addEventListener('eho:gatechange', () => {
    renderSidebar();
    if (entries[currentIndex] && entries[currentIndex].restricted && !Gate.isUnlocked()) {
      const fv = entries.findIndex(e => !e.restricted || Gate.isUnlocked());
      currentIndex = fv < 0 ? 0 : fv;
    }
    renderEntry(currentIndex);
  });

  // ── OS SHELL BOOT ──
  // This page is the desktop: the reader lives in the Files window and the
  // Conversation Pit runs inside a frame in the Conversation Pit window. Both
  // are opened from the icons on the surface, so there is no page navigation.
  function initShell() {
    if (!WM.init()) return;
    WM.on('change', () => { renderTaskbar(); });

    // Adopted, not rebuilt: the decode engine holds a live reference to
    // #entryBox and to its scroll state, so the nodes must not be recreated.
    const files = document.getElementById('win-files');
    if (files) {
      WM.adopt(files, {
        appId: 'files',
        title: 'Files',
        icon: '../mats/icons/Files_icon.png',
        width: 900, height: 640, minW: 340, minH: 260
      });
    }

    // Admin.exe and both editors are adopted, then closed: an app should not be
    // on screen until it is opened, and the desktop icon is the way in.
    const admin = document.getElementById('win-admin');
    if (admin) {
      const win = WM.adopt(admin, {
        appId: 'admin',
        title: 'Admin.exe',
        icon: '../mats/icons/CONV.png',
        width: 420, height: 320, minW: 300, minH: 220
      });
      if (win) WM.close(win);
    }

    const entry = document.getElementById('win-entry');
    if (entry) {
      const win = WM.adopt(entry, {
        appId: 'entry',
        title: 'Entry.exe',
        icon: '../mats/icons/Files_icon.png',
        width: 760, height: 620, minW: 340, minH: 260
      });
      if (win) WM.close(win);
    }

    const conv = document.getElementById('win-conv');
    if (conv) {
      const win = WM.adopt(conv, {
        appId: 'conv',
        title: 'Conv.exe',
        icon: '../mats/icons/CONV.png',
        width: 820, height: 640, minW: 340, minH: 260
      });
      if (win) WM.close(win);
    }

    // The Conv.exe frame is built on first open, not at boot, so the second copy
    // of the Conversation Pit is never downloaded until it is asked for.
    WM.register('conv', {
      onOpen(win) {
        if (win.frame) return;
        const frame = document.createElement('iframe');
        frame.className = 'app-frame';
        frame.title = 'Conv.exe — conversation editor';
        frame.src = 'ConversationPit.html?app=editor';
        win.el.querySelector('.conv-body').appendChild(frame);
        win.frame = frame;
        frame.addEventListener('focus', () => WM.focus(win));
      }
    });

    WM.register('chat', {
      appId: 'chat',
      title: 'Conversation Pit',
      icon: '../mats/icons/Conversations_icon.png',
      iconClass: 'pwin-ico-chat',
      width: 900, height: 640, minW: 340, minH: 260,
      build: function (win, body) {
        const frame = document.createElement('iframe');
        frame.className = 'app-frame';
        frame.title = 'Conversation Pit';
        frame.src = 'ConversationPit.html';
        body.appendChild(frame);
        win.frame = frame;
        // Clicking into the frame does not bubble to this document, so the
        // window would never come forward on its own.
        frame.addEventListener('focus', () => WM.focus(win));
      }
    });

    renderTaskbar();
  }

  trackEntryScrollActivity();
  loadEntries();
  initShell();
  // A phone boots with the drawer open, because the inline sidebar is part of
  // the layout until this runs - and an open drawer covers the first entry.
  // The Conversation Pit page collapses itself for the same reason.
  if (isMobile()) setSidebar(false);
</script>

</body>
</html>
