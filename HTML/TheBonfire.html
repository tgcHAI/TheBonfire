<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonfire.bat — Eternal Hearthlight Office</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/TheBonfire.css">
</head>
<body>

<div class="shell">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-logo"></div>
    <span class="topbar-title">Bonfire.exe</span>
    <span class="topbar-sub">Eternal Hearthlight Office — Lore Archive</span>
    <button class="editor-toggle" onclick="toggleEditor()" title="Open Entry Editor">&#9998;</button>
  </header>

  <!-- EDITOR DROPDOWN -->
  <div class="editor-panel" id="editorPanel">
    <div class="editor-inner">
      <div class="editor-heading">
        <span>Entry Editor</span>
        <div class="editor-actions">
          <button class="ed-btn ed-new" onclick="newEntry()">New</button>
          <button class="ed-btn ed-save" onclick="saveEntry()">Save</button>
          <button class="ed-btn ed-delete" onclick="deleteEntry()">Delete</button>
          <button class="ed-btn ed-export" onclick="exportJSON()">Export JSON</button>
        </div>
      </div>
      <div class="editor-fields">
        <div class="ed-row">
          <div class="ed-field">
            <label>ID</label>
            <input type="text" id="ed-id" placeholder="EHO-005">
          </div>
          <div class="ed-field">
            <label>Title</label>
            <input type="text" id="ed-title" placeholder="Entry title">
          </div>
          <div class="ed-field">
            <label>Author</label>
            <input type="text" id="ed-author" placeholder="Author name">
          </div>
          <div class="ed-field">
            <label>Date</label>
            <input type="text" id="ed-date" placeholder="21XX">
          </div>
        </div>
        <div class="ed-row">
          <div class="ed-field">
            <label>Status</label>
            <input type="text" id="ed-status" placeholder="Active / Ongoing / Sealed...">
          </div>
          <div class="ed-field">
            <label>Category</label>
            <input type="text" id="ed-category" placeholder="Field Observation, Personal Log...">
          </div>
          <div class="ed-field">
            <label>Tags <span class="ed-hint">(comma separated)</span></label>
            <input type="text" id="ed-tags" placeholder="tag1, tag2, tag3">
          </div>
          <div class="ed-field ed-field-check">
            <label>
              <input type="checkbox" id="ed-restricted">
              Restricted
            </label>
          </div>
        </div>
        <div class="ed-field ed-body-field">
          <label>Body <span class="ed-hint">(blank line = new paragraph)</span></label>
          <textarea id="ed-body" placeholder="Write the entry here..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="body">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-label">Entries</div>
      <!-- populated by JS -->
    </nav>

    <!-- MAIN -->
    <main class="main">
      <div class="entry-header" id="entryHeader">
        <!-- populated by JS -->
      </div>
      <div class="entry-box-wrap">
        <div class="entry-box" id="entryBox">
          <!-- populated by JS -->
        </div>
      </div>
    </main>

  </div>
</div>

<script>
  // Built-in fallback so the archive renders even when opened via file://
  // (browsers block fetch() of local files). Served over HTTP, this is
  // replaced by the contents of ../json/entries.json.
  let entries = [
  {
    "id": "EHO-001",
    "title": "The Prolouge",
    "author": "Salaknib",
    "date": "21XX",
    "status": "Archived",
    "restricted": true,
    "category": "Origin",
    "tags": [
      "Start"
    ],
    "body": "There are many ways to fight. Physically and mentally.\n\nEach with their weapons.\n\nA bullet leaves a hole. A knife leaves a scar.\n\nThe mind is different.\n\nA commander uses propaganda.\n\nA politician uses fear.\n\nA parent can use guilt.\n\nA lover can use silence.\n\nA friend can betray trust.\n\nA person can gaslight themselves.\n\n\nIsn't it funny? The most deadly of weapons? Not guns or blades, but the one everyone has.\n\nYou can wound a man without ever touching him.\n\nYou want to know what they are?\n\nWeapons that make a man doubt what he knows. _Seeds._\n\nWeapons that make a man obey. _Chains._\n\nWeapons that sever a man from everyone around him. _Knives._\n\nWeapons that turn a man's own emotions against him. _Fire._\n\nWeapons that bury the person underneath the wounds. _Graves._\n\n\n**Doubt.**\n\nA man who knows his enemy can fight him.\nA man who does not know whether his enemy exists cannot.\n\n\n**Gaslighting.**\n\nSow the seed.\nTell him what he saw did not happen.\nTell him what he remembers is wrong.\nTell him everyone else remembers differently.\nDo it long enough, and eventually he will stop asking whether you are lying.\nHe will ask whether he is sane. If he is still him.\n\n\n**Propaganda.**\n\nDo not tell a man what to think.\nTell him what everyone else thinks.\nGive him a thousand voices repeating the same thing, and soon his own voice will sound like the strange one.\nFor a voice in a cacophony of voices is nothing but noises.\n\n\n**Contradiction.**\n\nTell him one truth.\nThen another.\nThen take the first away.\nKeep changing the ground beneath his feet.\nEventually, he will stop looking for solid ground.\n\n\nThe wounds...are a place where these seeds will go.\nThat is where the stem that has the thorns will grow.\nDoubt makes a man uncertain.\nBut for them to move?\n\n\n**Fear.**\n\nA useful weapon.\nIt does not need to be real.\nIt only needs to feel real.\nA shadow behind a door.\nA letter without a name.\nA threat without a date.\nSometimes the greatest weapon is not knowing when it will come.\n\n\n**Guilt.**\n\nA quieter chain.\nMake a man believe that his suffering is his fault.\nThen make him believe that obedience is the only way to make things right.\nHe will put the chains on himself.\n\n\n**Obligation.**\n\nTell him what you have done for him.\nRemind him what he owes you.\nKeep a debt alive long after it has been repaid.\nSome men will endure anything rather than be called ungrateful.\n\n\n**Reverse Psychology.**\nTell a man not to do something.\n\nMake him believe the choice is his.\nThe cleverest cage is the one the prisoner mistakes for freedom.\n\n\n_The Chains_ of Submission.\n\nA man does not need to be forced if he can be convinced to volunteer.\n\nBut you know what makes one so deadly?\n\n\nA lonely man is easier to break.\n\nNot out of weakness no.\nBecause there is no one left to tell him that he is being broken.\n\n\n**Isolation.**\n\nRemove the family.\nRemove the friends.\nRemove the people who knew him before.\nThen become the only voice remaining.\n\n\n**Silence.**\n\nThe absence of an answer can be more cruel than an answer itself.\nTell a man something terrible is coming.\nThen say nothing.\nHe will imagine a thousand endings.\nMost will be worse than the truth.\nThat is the beauty of silence.\nThe enemy does not have to create the fear.\nThe victim creates it for him.\n\n\n**Betrayal.**\n\nTrust is a door.\nBetrayal is teaching a man that opening it was a mistake.\nDo it once, and he becomes cautious.\nDo it enough times, and he stops opening doors altogether.\n\n\n**Rejection.**\n\nMake a man believe that he is unwanted.\nEventually, he will begin removing himself from places where nobody asked him to leave.\n\n\nLoneliness is the scars, the bleeding wounds, these ones make\n\nAnd loneliness makes excellent soil.\n\n\nFear is obvious.\n\nThere are worse things. And how blinding they are. For it is what everyone seeks, like flies to shit.\n\n\n**Hope.**\n\nOh. Beautiful Hope...\n\nGive a man light.\n\nGive him something to live for.\n\nGive him a reason to endure the flaying, the scars.\n\nThen take it away.\n\nFear tells a man that tomorrow will be terrible.\n\nHope tells him that tomorrow might be beautiful.\n\nThat is why hope can be crueler.\n\nA man will endure almost anything if he believes the suffering will end.\n\n\n**Love.**\n\nThe nectar of gods and monsters.\n\nThe stronger the attachment, the deeper the wound.\n\nYou do not need to hurt the man.\n\nHurt what he loves.\n\nHe will do the rest himself trying to save them. trying to cover them.\n\n\"My love! Oh, my love! I will be your shield!\"\n\nAnd watch them dissolve into a *sobbing.* **broken.** ***mess.*** as they hold their corpse.\n\n\n**Grief.**\n\nGrief is a fire that feeds on memory. That feeds on the seeds, the chains, the knives.\n\nYou cannot always extinguish it.\n\nSometimes all you can do is teach a man to carry it.\n\nAnd carry it they shall. for they will take it in like a orphaned child.\n\n\n**Shame.**\n\nMake him believe that what he did is not merely something he regrets.\n\nMake him believe it is what he is.\nThere is a difference between:\n\n*“I did something terrible.”*\n\nAnd:\n\n*“I am terrible.”*\n\nThe first can be forgiven. The second can become a prison.\n\nDesperation. That is the burns the Fires leave.\n\nA desperate man will destroy himself just to reach the thing he believes will save him.\n\nAnd what is the man beneath all of this? \n\nWhere is a corpse buried when they are nothing more but a husk of their former self?\n\n_Graves_. They leave nothing recognizable behind.\n\n\n**Memory.**\n\nA man's memories are his evidence. His precious, so so precious proofs.\n\nProof that he lived.\n\nProof that he loved.\n\nProof that he suffered.\n\nTake those away, and what remains?\n\n\n**Identity.**\n\nTell him what he is often enough, and eventually he may stop deciding for himself.\n\nSoldier.\n\nCoward.\n\nMonster.\n\nHero.\n\nTraitor.\n\nParent.\n\nMurderer.\n\nNames are strange things.\n\nPut one on a man long enough, and he may begin wearing it like a uniform.\n\n\n**Purpose.**\n\nA soldier can survive terrible things if he believes they mean something.\n\nTake away the meaning.\n\nThe scars of suffering remains.\n\n\n**Trust.**\n\nOnce all is said and done, once the mind has been broken and the truth finally revealed...\n\nshatter the trust as well.\n\nNot merely trust in others.\nTrust in himself.\n\nMake him wonder whether every kindness was a trap.\n\nEvery memory, false.\n\nEvery friend, an enemy.\n\nEvery decision, a mistake.\n\nThat is when a man becomes truly alone.\n\nDissolution is what Graves are.\n\n\nThe death of the person who was there before.\n\nNo blood. No funeral. No grave.\n\nJust absence and the hole where they once were.\n\n\nThere is one weapon that does not belong to any category.\n\nIt's not the strongest. but it's the second best.\n\na jack of all trades.\n\n\n**The Lie**\n\nA lie can create doubt.\n\nA lie can create fear.\n\nA lie can destroy trust.\n\nA lie can isolate.\n\nA lie can create hope\n\nA lie can destroy hope.\n\nA lie can change a man's memory.\n\nA lie can change his identity.\n\n\nAnd the greatest lie of all?\n\nThat the war is over.\n\nI... \nused to think war was fought with guns.\nThen I thought it was fought with men.\n\nWrong. oh how wrong I am.\n\nWar is fought with whatever a man can use to make another man surrender.\n\nSometimes a rifle.\nOthers are word, \nand a handful is silence.\n\nBut...\n\nSometimes the enemy does not have to do anything at all.\nSometimes all he has to do is leave the door open.\n\nAnd wait for you to walk through it.\nThat is the thing nobody tells you about war.\n\nThe battlefield does not always follow you home.\n\nyou bring it with you. Willing or not."
  }
];
  let currentIndex = 0;
  let editingIndex = -1;

  // ── LOAD ──
  async function loadEntries() {
    try {
      const res = await fetch('../json/entries.json?nocache=' + Date.now());
      entries = await res.json();
    } catch(e) {
      // fetch unavailable (e.g. file://) — keep the embedded fallback entries
    }
    renderSidebar();
    renderEntry(0);
  }

  // ── SIDEBAR ──
  function renderSidebar() {
    const nav = document.getElementById('sidebar');
    nav.innerHTML = '<div class="sidebar-label">Entries</div>';
    entries.forEach((e, i) => {
      const a = document.createElement('a');
      a.className = 'nav-item' + (i === currentIndex ? ' active' : '');
      a.href = '#';
      a.innerHTML = `
        <span class="entry-id">${e.id}</span>
        ${e.restricted ? '<span class="restricted-badge">&#128274;</span> ' : ''}${e.title}
      `;
      a.onclick = (ev) => { ev.preventDefault(); switchEntry(i); };
      nav.appendChild(a);
    });
  }

  // ── RENDER ENTRY ──
  function renderEntry(index) {
    if (!entries.length) return;
    currentIndex = index;
    const e = entries[index];

    // header
    document.getElementById('entryHeader').innerHTML = `
      <div class="entry-id-tag">${e.id} &mdash; ${e.category}</div>
      <div class="entry-title">${e.title}${e.restricted ? ' <span class="restricted-badge">&#128274;</span>' : ''}</div>
      <div class="entry-meta">
        <span>${e.author}</span>
        <span>${e.date}</span>
        <span>${e.status}</span>
        <span class="entry-tags">${(e.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</span>
      </div>
    `;

    // inline markdown parser
    function parseInline(text) {
      return text
        // bold — **word**
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // italic — *word* (no lookbehind, so it parses on every browser;
        // bold is replaced first, so any remaining * is a single italic marker)
        .replace(/\*([^*\s][^*]*?)\*/g, '<em>$1</em>')
        // underline — _word_
        .replace(/\_(.+?)\_/g, '<u>$1</u>');
    }

    // Split on 3 newlines first (spacer) then 2 (paragraph).
    // We tag each chunk so we know which gap preceded it.
    const box = document.getElementById('entryBox');
    const chunks = [];
    // Split on \n\n\n (spacer gap) — keep the delimiter type
    const spacerParts = e.body.split(/\n{3}/);
    spacerParts.forEach((part, si) => {
      // Within each spacer-section, split on \n\n (normal paragraph gap)
      const paraParts = part.split(/\n\n/);
      paraParts.forEach((block, pi) => {
        if (si > 0 && pi === 0) {
          // this block follows a spacer gap — insert spacer before it
          chunks.push({ type: 'spacer' });
        }
        chunks.push({ type: 'block', text: block });
      });
    });

    let firstParagraph = true;
    box.innerHTML = chunks.map(chunk => {
      if (chunk.type === 'spacer') return '<div class="spacer"></div>';
      if (!chunk.text.trim()) return ''; // skip empty
      const lines = chunk.text.split('\n').map(parseInline).join('<br>');
      if (firstParagraph) {
        firstParagraph = false;
        const first = lines.charAt(0);
        const rest = lines.slice(1);
        return `<p><span class="drop">${first}</span>${rest}</p>`;
      }
      return `<p>${lines}</p>`;
    }).join('');
    // Large top padding keeps the first line below the box top at
    // scrollTop = 0 (wheel-picker feel) — no extra calculation needed.
    box.scrollTop = 0;
  }

  function switchEntry(index) {
    currentIndex = index;
    renderSidebar();
    renderEntry(index);
    // keep the editor form aligned with the entry being viewed when the panel
    // is open (otherwise the form and editingIndex can silently point at another entry**
    if (document.getElementById('editorPanel').classList.contains('open')) loadEditorFields(index);
  }

  // ── EDITOR TOGGLE ──
  function toggleEditor() {
    const panel = document.getElementById('editorPanel');
    const open = panel.classList.toggle('open');
    if (open) loadEditorFields(currentIndex);
  }

  function loadEditorFields(index) {
    editingIndex = index;
    const e = entries[index] || {};
    document.getElementById('ed-id').value       = e.id       || '';
    document.getElementById('ed-title').value    = e.title    || '';
    document.getElementById('ed-author').value   = e.author   || '';
    document.getElementById('ed-date').value     = e.date     || '';
    document.getElementById('ed-status').value   = e.status   || '';
    document.getElementById('ed-category').value = e.category || '';
    document.getElementById('ed-tags').value     = (e.tags||[]).join(', ');
    document.getElementById('ed-restricted').checked = e.restricted || false;
    document.getElementById('ed-body').value     = e.body     || '';
  }

  function fieldsToEntry() {
    // Normalize body: collapse 3+ newlines to 2, ensure paragraph breaks
    // are always \n\n so the renderer splits them correctly regardless of
    // whether the user pressed Enter once or twice.
    const rawBody = document.getElementById('ed-body').value;
    const normalizedBody = rawBody
      .replace(/\r\n/g, '\n')       // Windows line endings → unix
      .replace(/\r/g, '\n')         // old Mac line endings → unix
      .replace(/\n{4,}/g, '\n\n\n'); // 4+ newlines → exactly 3 (spacer max)
    return {
      id:         document.getElementById('ed-id').value.trim(),
      title:      document.getElementById('ed-title').value.trim(),
      author:     document.getElementById('ed-author').value.trim(),
      date:       document.getElementById('ed-date').value.trim(),
      status:     document.getElementById('ed-status').value.trim(),
      restricted: document.getElementById('ed-restricted').checked,
      category:   document.getElementById('ed-category').value.trim(),
      tags:       document.getElementById('ed-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
      body:       normalizedBody
    };
  }

  async function persistEntries() {
    try {
      const res = await fetch('../api/entries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entries)
      });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      return 'written';
    } catch (err) {
      // HTML opened without the server (e.g. double-clicked** — keep the
      // in-memory edit, but nothing is written to disk until it's served
      // via server.js. ("browser only" flash messages below.)
      return 'offline';
    }
  }

  // ── NEW ENTRY ──
  function newEntry() {
    const blank = {
      id: 'EHO-' + String(entries.length + 1).padStart(3,'0'),
      title: 'New Entry',
      author: '',
      date: '21XX',
      status: 'Active',
      restricted: false,
      category: '',
      tags: [],
      body: ''
    };
    entries.push(blank);
    editingIndex = entries.length - 1;
    loadEditorFields(editingIndex);
    renderSidebar();
  }

  // ── SAVE ENTRY ──
  async function saveEntry() {
    if (editingIndex < 0) return;
    entries[editingIndex] = fieldsToEntry();
    renderSidebar();
    renderEntry(editingIndex);
    // persist the whole archive back to json/entries.json via the local server.
    // ("browser only" below = opened without server.js — change lives in memory
    // but won't survive a reload until the server writes it to disk.)


    const wrote = await persistEntries();
    const msg = wrote === 'written' ? 'Saved to file!' : 'Saved (browser only)';
    flashBtn('ed-save', msg);
  }

  // ── DELETE ENTRY ──
  async function deleteEntry() {
    if (editingIndex < 0 || !entries.length) return;
    if (!confirm(`Delete "${entries[editingIndex].title}"?`)) return;
    entries.splice(editingIndex, 1);
    editingIndex = Math.max(0, editingIndex - 1);
    currentIndex = editingIndex;
    renderSidebar();
    if (entries.length) {
      loadEditorFields(editingIndex);
      renderEntry(editingIndex);
    } else {
      document.getElementById('entryHeader').innerHTML = '';
      document.getElementById('entryBox').innerHTML = '';
    }
    await persistEntries().then(w => flashBtn('ed-delete', w === 'written' ? 'Deleted' : 'Deleted (browser only)'));
  }

  // ── EXPORT JSON ──
  function exportJSON() {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'entries.json';
    a.click();
    URL.revokeObjectURL(a.href);
    flashBtn('ed-export', 'Exported!');
  }

  function flashBtn(cls, text) {
    const btn = document.querySelector('.' + cls);
    const orig = btn.textContent;
    btn.textContent = text;
    btn.style.color = 'var(--ember-bright)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1800);
  }

  // sidebar clicks reload the editor fields when the editor panel is open
  // (see switchEntry) — keeps editingIndex aligned with the shown entry

  loadEntries();
</script>

</body>
</html>
