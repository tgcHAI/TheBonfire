<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonfire.bat — Eternal Hearthlight Office</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/TheBonfire.css">
</head>
<body>

<div class="shell">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-logo"></div>
    <span class="topbar-title">TheBonfire</span>
    <span class="topbar-sub">Eternal Hearthlight Office — Lore Archive</span>
    <button class="editor-toggle" onclick="toggleEditor()" title="Open Entry Editor">&#9998;</button>
  </header>

  <!-- EDITOR DROPDOWN -->
  <div class="editor-panel" id="editorPanel">
    <div class="editor-inner">
      <div class="editor-heading">
        <span>Entry Editor</span>
        <div class="editor-actions">
          <button class="ed-btn ed-new" onclick="newEntry()">New</button>
          <button class="ed-btn ed-save" onclick="saveEntry()">Save</button>
          <button class="ed-btn ed-delete" onclick="deleteEntry()">Delete</button>
          <button class="ed-btn ed-export" onclick="exportJSON()">Export JSON</button>
        </div>
      </div>
      <div class="editor-fields">
        <div class="ed-row">
          <div class="ed-field">
            <label>ID</label>
            <input type="text" id="ed-id" placeholder="EHO-005">
          </div>
          <div class="ed-field">
            <label>Title</label>
            <input type="text" id="ed-title" placeholder="Entry title">
          </div>
          <div class="ed-field">
            <label>Author</label>
            <input type="text" id="ed-author" placeholder="Author name">
          </div>
          <div class="ed-field">
            <label>Date</label>
            <input type="text" id="ed-date" placeholder="21XX">
          </div>
        </div>
        <div class="ed-row">
          <div class="ed-field">
            <label>Status</label>
            <input type="text" id="ed-status" placeholder="Active / Ongoing / Sealed...">
          </div>
          <div class="ed-field">
            <label>Category</label>
            <input type="text" id="ed-category" placeholder="Field Observation, Personal Log...">
          </div>
          <div class="ed-field">
            <label>Tags <span class="ed-hint">(comma separated)</span></label>
            <input type="text" id="ed-tags" placeholder="tag1, tag2, tag3">
          </div>
          <div class="ed-field ed-field-check">
            <label>
              <input type="checkbox" id="ed-restricted">
              Restricted
            </label>
          </div>
        </div>
        <div class="ed-field ed-body-field">
          <label>Body <span class="ed-hint">(blank line = new paragraph)</span></label>
          <textarea id="ed-body" placeholder="Write the entry here..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="body">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-label">Entries</div>
      <!-- populated by JS -->
    </nav>

    <!-- MAIN -->
    <main class="main">
      <div class="entry-header" id="entryHeader">
        <!-- populated by JS -->
      </div>
      <div class="entry-box-wrap">
        <div class="entry-box" id="entryBox">
          <!-- populated by JS -->
        </div>
      </div>
    </main>

  </div>
</div>

<script>
  // Built-in fallback so the archive renders even when opened via file://
  // (browsers block fetch() of local files). Served over HTTP, this is
  // replaced by the contents of ../json/entries.json.
  let entries = [
    {
      "id": "EHO-001",
      "title": "The Hearthlight Compact",
      "author": "Salaknib",
      "date": "21XX",
      "status": "Active",
      "restricted": false,
      "category": "Origin",
      "tags": ["founding", "doctrine", "salaknib"],
      "body": "There are those who build walls and those who build fires. The wall keeps things out. The fire keeps things alive. The Eternal Hearthlight Office was not built to be a fortress. It was built to be the light you can see from the road when you have been walking too long in the dark and you are beginning to wonder whether you have the wrong road or no road at all.\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\n\nExcepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."
    },
    {
      "id": "EHO-002",
      "title": "On the Nature of the Backstreets",
      "author": "Unknown",
      "date": "21XX",
      "status": "Ongoing",
      "restricted": false,
      "category": "Field Observation",
      "tags": ["backstreets", "field", "environment"],
      "body": "The Backstreets do not care about you. That is the first thing to understand. They are not hostile in the way that a predator is hostile — they do not select targets, do not stalk, do not plan. They are simply indifferent, which is in some ways worse, because indifference does not tire and cannot be reasoned with.\n\nLorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua."
    },
    {
      "id": "EHO-003",
      "title": "Field Notes — Director Salaknib",
      "author": "Salaknib",
      "date": "21XX",
      "status": "Restricted",
      "restricted": true,
      "category": "Personal Log",
      "tags": ["salaknib", "personal", "director"],
      "body": "I write this not because anyone asked me to. I write this because the habit was given to me by someone who understood that writing things down is the only reliable way to keep them from being taken. He is not here. The habit remains. I suppose that is the point.\n\nThe office is warm tonight. Everyone is fed. I checked twice. I will check again before I sleep, which will be late, which is fine. The fire does not go out on its own. Someone has to tend it. I do not mind. I just wish, sometimes, that someone would ask if I was tired."
    },
    {
      "id": "EHO-004",
      "title": "The Wayward & The Hearth",
      "author": "Office Archive",
      "date": "21XX",
      "status": "Sealed",
      "restricted": false,
      "category": "Historical Record",
      "tags": ["wayward", "history", "founding"],
      "body": "They came in two directions. The ones who kept moving became the Wayward Travelers — named honestly, because they had somewhere once and the having of it is now the thing that follows them. The ones who stopped, who turned around and built something in the wreckage, became us. Neither choice was wrong. Both choices cost something.\n\nThe door between us is open. It will stay open. If the Wayward find their way back — and some will, eventually, because wandering has a way of circling — there will be a fire here. There will always be a fire here. That is the only promise the Hearthlight makes and the only one it intends to keep."
    }
  ];
  let currentIndex = 0;
  let editingIndex = -1;

  // ── LOAD ──
  async function loadEntries() {
    try {
      const res = await fetch('../json/entries.json?nocache=' + Date.now());
      entries = await res.json();
    } catch(e) {
      // fetch unavailable (e.g. file://) — keep the embedded fallback entries
    }
    renderSidebar();
    renderEntry(0);
  }

  // ── SIDEBAR ──
  function renderSidebar() {
    const nav = document.getElementById('sidebar');
    nav.innerHTML = '<div class="sidebar-label">Entries</div>';
    entries.forEach((e, i) => {
      const a = document.createElement('a');
      a.className = 'nav-item' + (i === currentIndex ? ' active' : '');
      a.href = '#';
      a.innerHTML = `
        <span class="entry-id">${e.id}</span>
        ${e.restricted ? '<span class="restricted-badge">&#128274;</span> ' : ''}${e.title}
      `;
      a.onclick = (ev) => { ev.preventDefault(); switchEntry(i); };
      nav.appendChild(a);
    });
  }

  // ── RENDER ENTRY ──
  function renderEntry(index) {
    if (!entries.length) return;
    currentIndex = index;
    const e = entries[index];

    // header
    document.getElementById('entryHeader').innerHTML = `
      <div class="entry-id-tag">${e.id} &mdash; ${e.category}</div>
      <div class="entry-title">${e.title}${e.restricted ? ' <span class="restricted-badge">&#128274;</span>' : ''}</div>
      <div class="entry-meta">
        <span>${e.author}</span>
        <span>${e.date}</span>
        <span>${e.status}</span>
        <span class="entry-tags">${(e.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</span>
      </div>
    `;

    // inline markdown parser
    function parseInline(text) {
      return text
        // bold — **word**
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // italic — *word* (no lookbehind, so it parses on every browser;
        // bold is replaced first, so any remaining * is a single italic marker)
        .replace(/\*([^*\s][^*]*?)\*/g, '<em>$1</em>')
        // underline — _word_
        .replace(/\_(.+?)\_/g, '<u>$1</u>');
    }

    // Split on 3 newlines first (spacer) then 2 (paragraph).
    // We tag each chunk so we know which gap preceded it.
    const box = document.getElementById('entryBox');
    const chunks = [];
    // Split on \n\n\n (spacer gap) — keep the delimiter type
    const spacerParts = e.body.split(/\n{3}/);
    spacerParts.forEach((part, si) => {
      // Within each spacer-section, split on \n\n (normal paragraph gap)
      const paraParts = part.split(/\n\n/);
      paraParts.forEach((block, pi) => {
        if (si > 0 && pi === 0) {
          // this block follows a spacer gap — insert spacer before it
          chunks.push({ type: 'spacer' });
        }
        chunks.push({ type: 'block', text: block });
      });
    });

    let firstParagraph = true;
    box.innerHTML = chunks.map(chunk => {
      if (chunk.type === 'spacer') return '<div class="spacer"></div>';
      if (!chunk.text.trim()) return ''; // skip empty
      const lines = chunk.text.split('\n').map(parseInline).join('<br>');
      if (firstParagraph) {
        firstParagraph = false;
        const first = lines.charAt(0);
        const rest = lines.slice(1);
        return `<p><span class="drop">${first}</span>${rest}</p>`;
      }
      return `<p>${lines}</p>`;
    }).join('');
    box.scrollTop = 0;
  }

  function switchEntry(index) {
    currentIndex = index;
    renderSidebar();
    renderEntry(index);
    // keep the editor form aligned with the entry being viewed when the panel
    // is open (otherwise the form and editingIndex can silently point at another entry**
    if (document.getElementById('editorPanel').classList.contains('open')) loadEditorFields(index);
  }

  // ── EDITOR TOGGLE ──
  function toggleEditor() {
    const panel = document.getElementById('editorPanel');
    const open = panel.classList.toggle('open');
    if (open) loadEditorFields(currentIndex);
  }

  function loadEditorFields(index) {
    editingIndex = index;
    const e = entries[index] || {};
    document.getElementById('ed-id').value       = e.id       || '';
    document.getElementById('ed-title').value    = e.title    || '';
    document.getElementById('ed-author').value   = e.author   || '';
    document.getElementById('ed-date').value     = e.date     || '';
    document.getElementById('ed-status').value   = e.status   || '';
    document.getElementById('ed-category').value = e.category || '';
    document.getElementById('ed-tags').value     = (e.tags||[]).join(', ');
    document.getElementById('ed-restricted').checked = e.restricted || false;
    document.getElementById('ed-body').value     = e.body     || '';
  }

  function fieldsToEntry() {
    // Normalize body: collapse 3+ newlines to 2, ensure paragraph breaks
    // are always \n\n so the renderer splits them correctly regardless of
    // whether the user pressed Enter once or twice.
    const rawBody = document.getElementById('ed-body').value;
    const normalizedBody = rawBody
      .replace(/\r\n/g, '\n')       // Windows line endings → unix
      .replace(/\r/g, '\n')         // old Mac line endings → unix
      .replace(/\n{4,}/g, '\n\n\n'); // 4+ newlines → exactly 3 (spacer max)
    return {
      id:         document.getElementById('ed-id').value.trim(),
      title:      document.getElementById('ed-title').value.trim(),
      author:     document.getElementById('ed-author').value.trim(),
      date:       document.getElementById('ed-date').value.trim(),
      status:     document.getElementById('ed-status').value.trim(),
      restricted: document.getElementById('ed-restricted').checked,
      category:   document.getElementById('ed-category').value.trim(),
      tags:       document.getElementById('ed-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
      body:       normalizedBody
    };
  }

  // ── PERSIST TO FILE ──
  // Writes the whole archive back to json/entries.json in place via the local
  // server (server.js**, run with node server.js → http://localhost). No file
  // dialogs or downloads — Save/Delete just POST the array to /api/entries.

  async function persistEntries() {
    try {
      const res = await fetch('../api/entries', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entries)
      });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      return 'written';
    } catch (err) {
      // HTML opened without the server (e.g. double-clicked** — keep the
      // in-memory edit, but nothing is written to disk until it's served
      // via server.js. ("browser only" flash messages below.)
      return 'offline';
    }
  }

  // ── NEW ENTRY ──
  function newEntry() {
    const blank = {
      id: 'EHO-' + String(entries.length + 1).padStart(3,'0'),
      title: 'New Entry',
      author: '',
      date: '21XX',
      status: 'Active',
      restricted: false,
      category: '',
      tags: [],
      body: ''
    };
    entries.push(blank);
    editingIndex = entries.length - 1;
    loadEditorFields(editingIndex);
    renderSidebar();
  }

  // ── SAVE ENTRY ──
  async function saveEntry() {
    if (editingIndex < 0) return;
    entries[editingIndex] = fieldsToEntry();
    renderSidebar();
    renderEntry(editingIndex);
    // persist the whole archive back to json/entries.json via the local server.
    // ("browser only" below = opened without server.js — change lives in memory
    // but won't survive a reload until the server writes it to disk.)


    const wrote = await persistEntries();
    const msg = wrote === 'written' ? 'Saved to file!' : 'Saved (browser only)';
    flashBtn('ed-save', msg);
  }

  // ── DELETE ENTRY ──
  async function deleteEntry() {
    if (editingIndex < 0 || !entries.length) return;
    if (!confirm(`Delete "${entries[editingIndex].title}"?`)) return;
    entries.splice(editingIndex, 1);
    editingIndex = Math.max(0, editingIndex - 1);
    currentIndex = editingIndex;
    renderSidebar();
    if (entries.length) {
      loadEditorFields(editingIndex);
      renderEntry(editingIndex);
    } else {
      document.getElementById('entryHeader').innerHTML = '';
      document.getElementById('entryBox').innerHTML = '';
    }
    await persistEntries().then(w => flashBtn('ed-delete', w === 'written' ? 'Deleted' : 'Deleted (browser only)'));
  }

  // ── EXPORT JSON ──
  function exportJSON() {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'entries.json';
    a.click();
    URL.revokeObjectURL(a.href);
    flashBtn('ed-export', 'Exported!');
  }

  function flashBtn(cls, text) {
    const btn = document.querySelector('.' + cls);
    const orig = btn.textContent;
    btn.textContent = text;
    btn.style.color = 'var(--ember-bright)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1800);
  }

  // sidebar clicks reload the editor fields when the editor panel is open
  // (see switchEntry) — keeps editingIndex aligned with the shown entry

  loadEntries();
</script>

</body>
</html>
